name: CI

# Continuous Integration only. No deploy, no publish, no release, no
# GitHub Pages, no secrets. This repository is a pure Markdown
# specification (373 .md files, zero code, zero JSON/YAML, zero
# Mermaid) — every job below exists because it checks something this
# repository actually contains. See CI-DESIGN.md for the analysis
# behind each decision, and for what was deliberately left out.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a still-running check for an older push once a newer one
# lands on the same branch/PR — different branches and different PRs
# each get their own group (github.ref differs), so this never cancels
# unrelated work, only a superseded run of the same one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 5 minutes on every job below: none of these checks take more than a
  # minute in practice against 373 files — this is a safety net against
  # a hung process, not a real budget, so it is generous on purpose.
  required-documents:
    name: Required project documents present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify required files exist
        run: |
          set -e
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "ROADMAP.md"
            "CI-DESIGN.md"
            "docs/README.md"
            "docs/PROJECT_STATUS.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required project file: $f"
              missing=1
            fi
          done
          exit "$missing"

  markdown-lint:
    name: Markdown structural lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check Markdown structure with markdownlint
        # Pinned to the exact commit for the v17 tag, verified directly
        # against the GitHub API before pinning (not guessed) — this is
        # a third-party action, not an official actions/* one; see
        # CI-DESIGN.md for why that distinction sets the pinning policy.
        # Dependabot (.github/dependabot.yml) proposes updates as a
        # reviewable PR when a new version is released.
        #
        # No `with: globs:` here on purpose — `.markdownlint-cli2.jsonc`
        # already declares its own top-level `globs`, which the tool
        # auto-discovers from the repo root with no action input
        # needed (verified against the tool's own documented config
        # discovery, not assumed). Setting it in both places would be
        # the same value declared twice for no reason.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  link-check:
    name: Internal link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check internal links with lychee
        # Pinned the same way and for the same reason as markdownlint
        # above — third-party action, SHA verified against the GitHub
        # API before use.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # No external links exist in this repository today (verified
          # directly) — lychee is still ready to check them at no
          # extra cost if any are ever added.
          #
          # --include-fragments (checking that "file.md#anchor" targets
          # a real heading, not just a real file) was deliberately left
          # out: zero real anchor-fragment links exist today — all
          # cross-references of that shape are written as plain
          # backtick-quoted text, not actual Markdown links, so lychee
          # cannot see them either way — and enabling it would add a
          # real, currently pointless risk (GitHub's heading-to-anchor
          # slug rules and lychee's own can diverge) for zero present
          # benefit. Revisit if real anchor links are ever introduced.
          # lychee's --exclude-path takes a regular expression, not a
          # glob (verified against the tool's own source at the pinned
          # version) — the dot is escaped so it matches a literal ".",
          # not "any character", even though the unescaped form would
          # have worked by coincidence against this repository's actual
          # paths.
          args: >-
            --no-progress
            --exclude-path '\.github'
            '**/*.md'
          fail: true
          jobSummary: true

  publication-metadata:
    name: Publication metadata consistency
    # Added per docs/Governance/Publication-Model.md and Release-Workflow.md.
    # Scope: this repository's OWN internal consistency only — whether the
    # Publication Manifest, the Specification version fields, and file
    # Status values agree with each other. It cannot and does not check
    # whether the live ocom.uno site matches this repository — the
    # Publication Engine that builds that site is confirmed to be entirely
    # external (no code, workflow, or config for it exists here). See
    # "Known Gaps" in Publication-Model.md. This is publication-metadata
    # consistency checking, not the Conformance Test Suite (EPIC-E, a
    # separate, unrelated, not-yet-built thing).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed to verify Manifest commits are real ancestors

      - name: Manifest commits must resolve to real, reachable commits
        run: |
          set -e
          manifest="docs/Governance/Publication-Manifest.md"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest not found"
            exit 1
          fi
          fail=0
          # Extract every non-TBD value of the `**Commit**` field.
          while IFS= read -r sha; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::Publication-Manifest.md declares commit '$sha' which does not exist in this repository's history"
              fail=1
            fi
          done < <(grep -oE '\*\*Commit\*\* \| `[0-9a-f]{7,40}`' "$manifest" | grep -oE '`[0-9a-f]{7,40}`' | tr -d '`')
          exit "$fail"

      - name: Manifest's Specification Version must match docs/Specification/*
        run: |
          set -e
          manifest="docs/Governance/Publication-Manifest.md"
          # Last non-TBD "Specification Version" value in the manifest is
          # treated as the one describing the current docs/Specification/
          # tree — deliberately simple: one manifest, one currently-live
          # Specification version, not a general multi-version diff tool.
          declared=$(grep -oE '\*\*Specification Version\*\* \| [0-9]+\.[0-9]+' "$manifest" | grep -v 'TBD' | tail -1 | grep -oE '[0-9]+\.[0-9]+$')
          if [ -z "$declared" ]; then
            echo "::warning::No resolvable, non-TBD Specification Version found in $manifest — skipping consistency check"
            exit 0
          fi
          fail=0
          for f in "docs/Specification"/*.md; do
            actual=$(grep -m1 -oE '\*\*Version:\*\* [0-9]+\.[0-9]+' "$f" | grep -oE '[0-9]+\.[0-9]+$' || true)
            if [ -n "$actual" ] && [ "$actual" != "$declared" ]; then
              echo "::error::$f declares Version $actual but Publication-Manifest.md's current Specification Version is $declared"
              fail=1
            fi
          done
          exit "$fail"

      - name: Entities/Overview.md Status must be Draft
        # Constitution-Step0-Summary.md Decision 4 excludes Entities/ from
        # Constitution §9's Core scope, but does not address this
        # document's own Status field, and its content remains normative
        # ("shall") throughout — so Status stays Draft. This is a narrow,
        # specific check, not a general Decision-vs-Status linter — see
        # Publication-Model.md for why Domains/Overview.md is deliberately
        # NOT checked the same way (a genuine, still-open per-document
        # judgment call, not a settled disposition).
        run: |
          set -e
          f="docs/Entities/Overview.md"
          status=$(grep -m1 -oE '\*\*Status:\*\* [A-Za-z]+' "$f" | awk '{print $2}')
          if [ "$status" != "Draft" ]; then
            echo "::error::$f Status is '$status', expected 'Draft' — its normative content was not reduced, per Constitution-Step0-Summary.md Decision 4 review"
            exit 1
          fi

      - name: Dangling normative-reference heuristic (advisory, non-blocking)
        # Heuristic only, grep-based, deliberately not made blocking: it
        # cannot reliably distinguish a genuine dangling reference (like
        # the "Lifecycle" case found in 05 Object Model.md before Core
        # Vocabulary coverage was checked) from an ordinary capitalized
        # word in a SHALL sentence that was never meant to resolve to a
        # term card. Surfaces candidates for a human to check — same
        # "suggest, never auto-apply" discipline already used by this
        # ecosystem's other heuristic tools (e.g. Vector's identity
        # normalization pass). Never fails the build.
        run: |
          set +e
          grep -noE '(shall|SHALL)[^.]*\b(participate in|define a|support|possess)[^.]*\b[A-Z][a-zA-Z]+' docs/Specification/*.md 2>/dev/null | \
          while IFS=: read -r file line match; do
            term=$(echo "$match" | grep -oE '[A-Z][a-zA-Z]+$')
            [ -z "$term" ] && continue
            if ! find docs/Meta docs/Models docs/AI docs/Core docs/Memory docs/Lifecycles -iname "*${term}*" 2>/dev/null | grep -q .; then
              echo "::warning file=${file},line=${line}::Possible dangling normative reference to '${term}' — no matching file found under Meta/Models/AI/Core/Memory/Lifecycles"
            fi
          done
          exit 0
