name: CI

# Continuous Integration only. No deploy, no publish, no release, no
# GitHub Pages, no secrets. This repository is a specification written in
# Markdown plus the small standard-library tools that check it: run
# `git ls-files '*.md' | wc -l` and `git ls-files 'tools/*.py' | wc -l`
# rather than trusting a count written here, which is how the previous
# header went stale. Every job below exists because it checks something
# this repository actually contains. See CI-DESIGN.md for the analysis
# behind each decision, and for what was deliberately left out.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a still-running check for an older push once a newer one
# lands on the same branch/PR — different branches and different PRs
# each get their own group (github.ref differs), so this never cancels
# unrelated work, only a superseded run of the same one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 5 minutes on every job below: none of these checks take more than a
  # minute in practice against 373 files — this is a safety net against
  # a hung process, not a real budget, so it is generous on purpose.
  required-documents:
    name: Required project documents present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify required files exist
        run: |
          set -e
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "ROADMAP.md"
            "CI-DESIGN.md"
            "docs/README.md"
            "docs/PROJECT_STATUS.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required project file: $f"
              missing=1
            fi
          done
          exit "$missing"

  markdown-lint:
    name: Markdown structural lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Markdown structure with markdownlint
        # Pinned to the exact commit for the v17 tag, verified directly
        # against the GitHub API before pinning (not guessed) — this is
        # a third-party action, not an official actions/* one; see
        # CI-DESIGN.md for why that distinction sets the pinning policy.
        # Dependabot (.github/dependabot.yml) proposes updates as a
        # reviewable PR when a new version is released.
        #
        # No `with: globs:` here on purpose — `.markdownlint-cli2.jsonc`
        # already declares its own top-level `globs`, which the tool
        # auto-discovers from the repo root with no action input
        # needed (verified against the tool's own documented config
        # discovery, not assumed). Setting it in both places would be
        # the same value declared twice for no reason.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  link-check:
    # External hosts are checked too. Badge and archive servers (zenodo.org)
    # sometimes answer in more than lychee's default 20 s; a longer timeout and
    # retries keep a slow host from failing a build whose links are all valid.
    name: Internal link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check internal links with lychee
        # Pinned the same way and for the same reason as markdownlint
        # above — third-party action, SHA verified against the GitHub
        # API before use.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # No external links exist in this repository today (verified
          # directly) — lychee is still ready to check them at no
          # extra cost if any are ever added.
          #
          # --include-fragments (checking that "file.md#anchor" targets
          # a real heading, not just a real file) was deliberately left
          # out: zero real anchor-fragment links exist today — all
          # cross-references of that shape are written as plain
          # backtick-quoted text, not actual Markdown links, so lychee
          # cannot see them either way — and enabling it would add a
          # real, currently pointless risk (GitHub's heading-to-anchor
          # slug rules and lychee's own can diverge) for zero present
          # benefit. Revisit if real anchor links are ever introduced.
          # lychee's --exclude-path takes a regular expression, not a
          # glob (verified against the tool's own source at the pinned
          # version) — the dot is escaped so it matches a literal ".",
          # not "any character", even though the unescaped form would
          # have worked by coincidence against this repository's actual
          # paths.
          # doi.org is excluded: it is a third-party resolver that this
          # repository does not control and that has repeatedly returned
          # 504 for minutes at a time (13 September 2026: six consecutive
          # probes, 30 s each, all 504, while the Zenodo record itself was
          # fine). The DOI *value* is guarded elsewhere: .zenodo.json,
          # CITATION.cff and docs/Governance/Publication-Manifest.md must
          # agree, and resolution is checked by hand at each release. A
          # third-party outage should not turn main red.
          args: >-
            --no-progress
            --timeout 45
            --max-retries 3
            --exclude-path '\.github'
            --exclude '^https://doi\.org/'
            '**/*.md'
          fail: true
          jobSummary: true

  publication-metadata:
    name: Publication metadata consistency
    # Added per docs/Governance/Publication-Model.md and Release-Workflow.md.
    # Scope: this repository's OWN internal consistency only — whether the
    # Publication Manifest, the Specification version fields, and file
    # Status values agree with each other. It cannot and does not check
    # whether the live ocom.uno site matches this repository — the
    # Publication Engine that builds that site is confirmed to be entirely
    # external (no code, workflow, or config for it exists here). See
    # "Known Gaps" in Publication-Model.md. This is publication-metadata
    # consistency checking, not the Conformance Test Suite (EPIC-E, a
    # separate, unrelated, not-yet-built thing).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed to verify Manifest commits are real ancestors

      - name: Manifest commits must resolve to real, reachable commits
        run: |
          set -e
          manifest="docs/Governance/Publication-Manifest.md"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest not found"
            exit 1
          fi
          fail=0
          # Every Commit cell, whatever it holds. Matching only well-formed hashes meant a cell
          # holding anything else was never examined, and the step passed having checked nothing.
          checked=0
          while IFS= read -r cell; do
            value=$(printf '%s' "$cell" | sed -E 's/^\| \*\*Commit\*\* \| //; s/ *\|$//' | tr -d '`' | sed -E 's/^ +| +$//g')
            case "$value" in
              TBD*|"") continue;;
            esac
            checked=$((checked+1))
            sha=$(printf '%s' "$value" | grep -oE '^[0-9a-fA-F]{7,40}' || true)
            if [ -z "$sha" ]; then
              echo "::error::Publication-Manifest.md declares a Commit this check cannot read: '$value'"
              fail=1
              continue
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::Publication-Manifest.md declares commit '$sha' which does not exist in this repository's history"
              fail=1
            elif ! git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
              # cat-file only asks whether the object is present, so a commit from an abandoned
              # branch or a dangling object passed a step whose name promises reachability.
              echo "::error::Publication-Manifest.md declares commit '$sha' which is not an ancestor of HEAD"
              fail=1
            fi
          done < <(grep -E '^\| \*\*Commit\*\* \|' "$manifest")
          releases=$(grep -cE '^## Release: ' "$manifest")
          if [ "$checked" -eq 0 ]; then
            echo "::error::Publication-Manifest.md names $releases Release(s) and this check examined no commit at all"
            fail=1
          fi
          echo "examined $checked commit(s) across $releases Release entries"
          exit "$fail"

      - name: Manifest's Specification Version must match docs/Specification/*
        run: |
          set -e
          manifest="docs/Governance/Publication-Manifest.md"
          # Last non-TBD "Specification Version" value in the manifest is
          # treated as the one describing the current docs/Specification/
          # tree — deliberately simple: one manifest, one currently-live
          # Specification version, not a general multi-version diff tool.
          declared=$(grep -oE '\*\*Specification Version\*\* \| [0-9]+\.[0-9]+' "$manifest" | grep -v 'TBD' | tail -1 | grep -oE '[0-9]+\.[0-9]+$')
          if [ -z "$declared" ]; then
            echo "::warning::No resolvable, non-TBD Specification Version found in $manifest — skipping consistency check"
            exit 0
          fi
          fail=0
          for f in "docs/Specification"/*.md; do
            # The Committee Review Package records the v0.2 review and keeps that Version field for good.
            case "$f" in *"Committee Review Package"*) continue;; esac
            actual=$(grep -m1 -oE '\*\*Version:\*\* [0-9]+\.[0-9]+' "$f" | grep -oE '[0-9]+\.[0-9]+$' || true)
            if [ -n "$actual" ] && [ "$actual" != "$declared" ]; then
              echo "::error::$f declares Version $actual but Publication-Manifest.md's current Specification Version is $declared"
              fail=1
            fi
          done
          exit "$fail"

      - name: Entities/Overview.md Status must be Draft
        # Constitution-Step0-Summary.md Decision 4 excludes Entities/ from
        # Constitution §9's Core scope, but does not address this
        # document's own Status field, and its content remains normative
        # ("shall") throughout — so Status stays Draft. This is a narrow,
        # specific check, not a general Decision-vs-Status linter — see
        # Publication-Model.md for why Domains/Overview.md is deliberately
        # NOT checked the same way (a genuine, still-open per-document
        # judgment call, not a settled disposition).
        run: |
          set -e
          f="docs/Entities/Overview.md"
          status=$(grep -m1 -oE '\*\*Status:\*\* [A-Za-z]+' "$f" | awk '{print $2}')
          if [ "$status" != "Draft" ]; then
            echo "::error::$f Status is '$status', expected 'Draft' — its normative content was not reduced, per Constitution-Step0-Summary.md Decision 4 review"
            exit 1
          fi

      - name: The records that count the registers agree with the registers
        # Three documents state how many Architecture Observations and ADR
        # Candidates exist, one of them the machine-facing llms.txt the site
        # serves. All three said 82 and AO-083 for two days after the registers
        # reached 92 and AO-093, and nothing compared them. The check lived
        # here as an inline script with no test of its own, and round 4 of the
        # all-packages test found it passing on a repository whose files state
        # the wrong counts in a wording it could not read; it is a tool now,
        # with negative tests beside the others.
        run: python3 tools/governance/register_counts.py --check

      - name: Every document carries its metadata block and a revision table
        # Governance/Documentation-Standards.md requires Document ID, Status,
        # Version, Last Updated and a Revision History in every document. The
        # Russian projection of the implementation case carries the same fields
        # under Russian labels, so both spellings are accepted; a check that
        # matched English only is what put that document on the GAP-007 list
        # twice. Three documents are outside the rule by recorded decision:
        # the Committee Review Package, which is the record of the 22 July 2026
        # review, and the Conformance Test Suite artifacts, covered by the
        # generated and append-only convention the standard records.
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          exceptions = {
              "docs/Specification/Committee Review Package.md",
              "docs/Governance/Requirement-Register.md",
              "docs/Governance/Requirement-Aliases.md",
              # Two artifacts of a suite run, not documents of this specification. The report is
              # produced by tools/conformance/validate.py and is append-only per
              # Conformance-Test-Suite.md Section 4; the Conformance Statement is an example of
              # what an implementation publishes about itself, and Language/Conformance.md:145
              # leaves its format to the implementation. Giving either an OCOM metadata block
              # would make it a worse example of the thing it is.
              "docs/Examples/Conformance/report.md",
              "docs/Examples/Conformance/conformance-statement.md",
              # the Reviewer Record is the third: an artifact a reviewer publishes, whose form
              # Conformance-Test-Suite.md Sections 3 and 4 fix and validate.py reads
              "docs/Examples/Conformance/reviewer-record.md",
          }
          pats = {
              "Document ID": re.compile(r"^\*\*Document ID:\*\*", re.M),
              "Status": re.compile(r"^\*\*(Status|Статус):\*\*", re.M),
              "Version": re.compile(r"^\*\*(Version|Версия):\*\*", re.M),
              "Last Updated": re.compile(r"^\*\*(Last Updated|Обновлено):\*\*", re.M),
              "Revision History": re.compile(r"^#{1,3} (Revision History|История ревизий)", re.M),
          }
          files = [f for f in subprocess.run(["git", "ls-files", "docs"], capture_output=True, text=True).stdout.splitlines() if f.endswith(".md")]
          fail = 0
          months = {m: i for i, m in enumerate(["January","February","March","April","May","June","July","August","September","October","November","December"], 1)}
          months.update({m: i for i, m in enumerate(["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"], 1)})
          def parse(d):
              m = re.match(r"(\d{1,2}) ([A-Za-zА-Яа-я]+) (\d{4})", d.strip())
              if not m:
                  return None
              mon = months.get(m.group(2)) or months.get(m.group(2).lower())
              return (int(m.group(3)), mon, int(m.group(1))) if mon else None
          def revision_rows(text):
              """Date cells of the Revision History table only.

              Scanning the whole document for a numbered table row matched other tables and, worse,
              a row written without spaces around the version cell matched nothing, so the entire
              Models tier and three Core documents were never examined by this rule.
              """
              m = re.search(r"^#{1,3} (?:Revision History|История ревизий)\s*$", text, re.M)
              if not m:
                  return [], []
              section = text[m.end():]
              cells = re.findall(r"^\|\s*[\d.]+\s*\|\s*([^|]+?)\s*\|", section, re.M)
              dates = [parse(c) for c in cells]
              return [d for d in dates if d], [c for c, d in zip(cells, dates) if d is None]

          for f in files:
              if pathlib.Path(f).name == "README.md" or f in exceptions:
                  continue
              text = pathlib.Path(f).read_text(encoding="utf-8")
              for name, pat in pats.items():
                  if not pat.search(text):
                      print("::error file=%s::%s is missing its %s" % (f, f, name))
                      fail = 1
              # A Last Updated field older than the document's own newest revision row is a
              # contradiction inside one document; fourteen carried one until 18 September 2026.
              lu = re.search(r"^\*\*(?:Last Updated|Обновлено):\*\* (.+)$", text, re.M)
              rows, unreadable = revision_rows(text)
              for cell in unreadable:
                  print("::error file=%s::%s has a revision row whose date cannot be read: %r" % (f, f, cell[:40]))
                  fail = 1
              if lu and rows:
                  cur = parse(lu.group(1))
                  if cur is None:
                      print("::error file=%s::%s has a Last Updated field this check cannot read: %r" % (f, f, lu.group(1).strip()[:40]))
                      fail = 1
                  elif max(rows) > cur:
                      print("::error file=%s::%s says Last Updated %s but its newest revision row is %04d-%02d-%02d" % (f, f, lu.group(1).strip(), *max(rows)))
                      fail = 1
          sys.exit(fail)
          PY

  requirement-register:
    name: Requirement register regenerates cleanly
    # Added per docs/Governance/Conformance-Test-Suite.md, Section 2, and the
    # rule AO-064 recommends for derived artifacts: the Requirement Register
    # is generated from the documents Chapters 4 to 6 compile, never edited by
    # hand, and a divergence between the committed file and a regeneration
    # fails the build. The second step keeps the append-only Alias File in
    # step with the register: every Statement needs an alias, an alias whose
    # identity no Statement carries must be marked superseded, and no
    # committed row may be edited in place. That last rule is about the
    # file's history, so the checkout fetches it: without history, editing a
    # row's Identity cell to match a changed sentence kept the alias, the
    # date and the note with every check green. The generator is
    # standard-library Python and reads only this repository.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the append-only Alias File is checked against its base revision

      - name: Register matches a regeneration
        run: python3 tools/conformance/requirement_register.py --check

      - name: Every Statement has an alias, and no committed row was edited
        # On a pull request the base is main and the tool finds it. On a push to
        # main there is no base but the commit itself, which is the file
        # compared against itself, so the push's own before-SHA is passed in.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/conformance/requirement_register.py --check-aliases --against "${{ github.event.before }}"
          else
            python3 tools/conformance/requirement_register.py --check-aliases
          fi

  principle-traceability:
    name: Principle traceability claims hold
    # Added per AO-074, which asks for a map from each Canonical Principle to
    # the rules that carry it. The map itself is judgment and is not generated;
    # what this job checks is the evidence under the judgment, so a reader who
    # disagrees with a verdict argues about the verdict rather than about the
    # facts. Every cited line must carry its quoted text verbatim, every named
    # Requirement Register alias must exist and carry the quoted sentence, every
    # row classified as a binding rule must quote a sentence carrying shall or
    # must, and each of the fourteen principles must have exactly one block
    # quoting it verbatim. A corpus edit that moves a cited line fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Every claim in Principle-Traceability.md resolves
        run: python3 tools/governance/principle_traceability.py --check

  compilation-survey:
    name: Compiled chapters carry what they declare
    # The register checks the reading path forward: every sentence a chapter carries traces to a
    # canonical document. AO-077 recorded that nothing checked the other direction, and three
    # obligations of Models/Entity.md and Models/Relationship.md were missing from Chapter 5 for
    # weeks with the forward check green. CAND-018 says only the verbatim form is a completeness
    # claim, so that is what this job enforces: a chapter declaring "compiled from ... verbatim"
    # must carry every mandatory Statement of the documents it names. Abridgement by the other
    # two forms is permitted and only counted, which the census prints.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Every verbatim chapter carries its sources
        run: python3 tools/conformance/compilation_survey.py --check

  test-catalogue:
    name: Test Catalogue is derived, not written
    # Conformance-Test-Suite.md Section 3 requires every mandatory and recommended Statement to
    # have exactly one Test of one of five kinds. Test-Catalogue.md is that binding, generated
    # from the register and the alias file and never edited by hand, so a moved sentence breaks
    # its own row instead of silently keeping a Test that no longer matches it. The rules that
    # assign a kind are printed in the document, and they send a Statement to Review as soon as
    # any part of it is beyond an export's reach: 62 of the 182 mandatory Statements carry a
    # mechanical kind and 120 do not, which the census states rather than hides.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Catalogue matches a regeneration
        run: python3 tools/conformance/test_catalogue.py --check
      - name: Reference Serialization schema matches a regeneration and the model satisfies it
        run: python3 tools/conformance/reference_schema.py --check

  published-sources:
    name: Published sources are readable by machines
    # publication/ holds the canonical text of the files ocom.uno serves that nothing else here
    # reproduces. Comparing them against the live site needs the network and is therefore not a
    # CI job; what is checked here needs no network: a source file must exist for every published
    # path the index names, and it must not write a bare URL against a sentence period, because a
    # harvester takes the punctuation with it. llms.txt published https://ocom.uno/why. that way,
    # and every machine that read the file asked the site for a page that does not exist.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sources exist and carry no glued URLs
        run: python3 tools/site/published_source_parity.py --lint

  tool-tests:
    name: Tool tests
    # The five tools are the machinery a published standard leans on, and the way such a tool
    # fails is by passing when it did no work: a presence row over an empty set, a citation leg
    # that compared nothing, a table row the parser dropped, an alias bound to two Statements.
    # Every case in tools/tests is a deliberately broken input the tool must exit non-zero on,
    # plus the healthy corpus, which must stay green. Standard library only, no network: the
    # site tool runs against an in-memory fixture served on loopback.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the append-only Alias File check reads history, and one test runs it here

      - name: Negative tests for the tools
        run: python3 tools/tests/test_tools.py

  reuse-compliance:
    name: Licensing is machine-readable (REUSE 3.3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: reuse lint
        # Every file in this repository must resolve to a copyright holder
        # and an SPDX licence identifier. The map is REUSE.toml (docs/ is
        # CC-BY-4.0, everything else Apache-2.0); the licence texts live in
        # LICENSES/. Third-party action, so pinned to the commit behind the
        # v5.0.0 tag, resolved with `git ls-remote --tags` and dereferenced
        # through the annotated tag before pinning. Dependabot proposes
        # bumps as reviewable PRs, same as the other pinned actions here.
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5.0.0
